<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: #f5f0e8; font-family: 'Noto Sans SC', sans-serif; }
</style>
</head>
<body class="min-h-screen p-6">

<div class="max-w-3xl mx-auto space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold text-gray-800">知识库管理</h1>
    <span id="conn-status" class="text-xs text-gray-400 font-mono">未连接</span>
  </div>



  <!-- 添加条目 -->
  <div class="bg-white border border-gray-200 rounded-xl p-5 space-y-3">
    <h2 class="text-xs font-mono text-gray-400 uppercase tracking-widest">添加条目</h2>
    <div>
      <label class="block text-xs text-gray-500 mb-1">标题</label>
      <input id="inp-title" type="text" placeholder="条目标题"
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400" />
    </div>
    <div>
      <label class="block text-xs text-gray-500 mb-1">内容</label>
      <textarea id="inp-content" rows="5" placeholder="条目详细内容…"
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400 resize-none"></textarea>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="addEntry()"
        class="text-sm font-mono bg-blue-600 text-white rounded-lg px-5 py-2 hover:bg-blue-500 transition-colors">
        添加
      </button>
      <span id="add-status" class="text-xs text-gray-400"></span>
    </div>
  </div>

  <!-- 推荐问题管理 -->
  <div class="bg-white border border-gray-200 rounded-xl p-5 space-y-3">
    <div class="flex items-center justify-between">
      <h2 class="text-xs font-mono text-gray-400 uppercase tracking-widest">推荐问题</h2>
      <button onclick="genSuggestQuestions()"
        class="text-xs font-mono bg-gray-800 text-white rounded-lg px-4 py-1.5 hover:bg-gray-700 transition-colors flex items-center gap-1.5" id="gen-btn">
        ✦ AI 生成
      </button>
    </div>
    <p class="text-xs text-gray-400">根据知识库内容自动生成10个常见问题，展示在前台供用户点击查询。</p>
    <div id="suggest-list" class="space-y-1.5 text-sm text-gray-400 italic">加载中…</div>
    <div id="gen-status" class="text-xs text-gray-400 hidden"></div>
  </div>

  <!-- 条目列表 -->
  <div class="bg-white border border-gray-200 rounded-xl p-5 space-y-3">
    <div class="flex items-center justify-between">
      <h2 class="text-xs font-mono text-gray-400 uppercase tracking-widest">条目列表</h2>
      <button onclick="loadEntries()" class="text-xs text-blue-500 hover:text-blue-400 font-mono">刷新</button>
    </div>
    <div id="entries-list" class="space-y-2 text-sm text-gray-400 italic">
      请先连接 Supabase
    </div>
  </div>

</div>

<script>
const SB_URL = 'https://cgtrlucacjrbtazidixn.supabase.co'
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNndHJsdWNhY2pyYnRhemlkaXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDI1NDcsImV4cCI6MjA5NDExODU0N30.PX_IncuHZfsLl23OHt00XXyswycFtkmcUI3Su7BWkWY'
let sb = null

window.addEventListener('load', () => {
  sb = supabase.createClient(SB_URL, SB_KEY)
  document.getElementById('conn-status').textContent = '已连接 ✓'
  document.getElementById('conn-status').className = 'text-xs text-green-500 font-mono'
  loadEntries()
  loadSuggestList()
})

// ── 添加条目 ──────────────────────────────────────────────────────────────────
async function addEntry() {
  if (!sb) { alert('请先连接 Supabase'); return }
  const title   = document.getElementById('inp-title').value.trim()
  const content = document.getElementById('inp-content').value.trim()
  if (!title || !content) { alert('标题和内容不能为空'); return }

  const status = document.getElementById('add-status')
  status.textContent = '提交中…'

  const { error } = await sb.from('knowledge_base').insert({ title, content })
  if (error) {
    status.textContent = '失败: ' + error.message
    status.className = 'text-xs text-red-500'
  } else {
    status.textContent = '✓ 已添加'
    status.className = 'text-xs text-green-500'
    document.getElementById('inp-title').value   = ''
    document.getElementById('inp-content').value = ''
    setTimeout(() => status.textContent = '', 2000)
    loadEntries()
  }
}

// ── 加载列表 ──────────────────────────────────────────────────────────────────
async function loadEntries() {
  if (!sb) return
  const box = document.getElementById('entries-list')
  box.innerHTML = '<div class="text-gray-400 italic text-sm">加载中…</div>'

  const { data, error } = await sb
    .from('knowledge_base')
    .select('id, title, content, created_at')
    .order('created_at', { ascending: false })
    .limit(100)

  if (error) {
    box.innerHTML = `<div class="text-red-500 text-sm">${error.message}</div>`
    return
  }
  if (!data.length) {
    box.innerHTML = '<div class="text-gray-400 italic text-sm">暂无条目</div>'
    return
  }

  box.innerHTML = data.map(r => `
    <div class="border border-gray-100 rounded-lg p-3 space-y-1">
      <div class="flex items-start justify-between gap-2">
        <span class="font-medium text-gray-800 text-sm">${escHtml(r.title)}</span>
        <button onclick="deleteEntry('${r.id}')"
          class="text-xs text-red-400 hover:text-red-600 shrink-0 font-mono">删除</button>
      </div>
      <p class="text-xs text-gray-500 leading-relaxed line-clamp-3">${escHtml(r.content)}</p>
      <span class="text-xs text-gray-300 font-mono">${new Date(r.created_at).toLocaleString('zh-CN')}</span>
    </div>
  `).join('')
}

// ── 删除条目 ──────────────────────────────────────────────────────────────────
async function deleteEntry(id) {
  if (!confirm('确认删除？')) return
  const { error } = await sb.from('knowledge_base').delete().eq('id', id)
  if (error) alert('删除失败: ' + error.message)
  else loadEntries()
}


// ── 推荐问题管理 ──────────────────────────────────────────────────────────────
const FN_BASE = 'https://cgtrlucacjrbtazidixn.supabase.co/functions/v1'

async function loadSuggestList() {
  const box = document.getElementById('suggest-list')
  const { data, error } = await sb
    .from('suggested_questions')
    .select('id, question, sort_order')
    .order('sort_order', { ascending: true })
  if (error) { box.innerHTML = `<div class="text-red-500">${error.message}</div>`; return }
  if (!data.length) { box.innerHTML = '<div class="italic">暂无推荐问题</div>'; return }
  box.innerHTML = data.map((r, i) => `
    <div class="flex items-center gap-2 py-1 border-b border-gray-50 last:border-0">
      <span class="text-xs text-gray-300 w-4 shrink-0">${i+1}</span>
      <span class="flex-1 text-sm text-gray-700">${escHtml(r.question)}</span>
      <button onclick="deleteSuggest('${r.id}')" class="text-xs text-red-400 hover:text-red-600 shrink-0">删除</button>
    </div>
  `).join('')
}

async function deleteSuggest(id) {
  if (!confirm('删除该问题？')) return
  await sb.from('suggested_questions').delete().eq('id', id)
  loadSuggestList()
}

async function genSuggestQuestions() {
  const btn    = document.getElementById('gen-btn')
  const status = document.getElementById('gen-status')
  btn.disabled = true
  btn.textContent = '生成中…'
  status.classList.remove('hidden')
  status.className = 'text-xs text-gray-500'
  status.textContent = '正在读取知识库并生成问题，约需10秒…'

  try {
    // 1. 取知识库摘要（前20条标题+内容片段）
    const { data: kb } = await sb
      .from('knowledge_base')
      .select('title, content')
      .order('created_at', { ascending: true })
      .limit(20)
    if (!kb || !kb.length) throw new Error('知识库为空，请先添加内容')

    const kbSummary = kb.map(r => `【${r.title}】${r.content.slice(0, 80)}`).join('\n')

    // 2. 调 Edge Function 生成问题
    const fnRes = await fetch(`${FN_BASE}/gen-suggest-questions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SB_KEY,
        'Authorization': `Bearer ${SB_KEY}`
      },
      body: JSON.stringify({ kb_summary: kbSummary })
    })
    const fnData = await fnRes.json()
    if (!fnRes.ok) throw new Error(fnData.error || `Edge Function 错误 ${fnRes.status}`)

    const questions = fnData.questions
    if (!questions || questions.length < 3) throw new Error('生成失败，请重试')

    // 3. 清空旧数据，写入新问题
    await sb.from('suggested_questions').delete().neq('id', '00000000-0000-0000-0000-000000000000')
    const rows = questions.map((q, i) => ({ question: q, sort_order: i + 1 }))
    const { error } = await sb.from('suggested_questions').insert(rows)
    if (error) throw new Error(error.message)

    status.className = 'text-xs text-green-500'
    status.textContent = `✓ 已生成 ${questions.length} 个问题`
    loadSuggestList()
  } catch (err) {
    status.className = 'text-xs text-red-500'
    status.textContent = '失败: ' + err.message
  } finally {
    btn.disabled = false
    btn.textContent = '✦ AI 生成'
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}
</script>
</body>
</html>
