<script>
// ─── 常量 ─────────────────────────────────────────────────────────────────────
const PCM_CHUNK_MS  = 200;
const SAMPLE_RATE   = 16000;
const CHUNK_SAMPLES = SAMPLE_RATE * PCM_CHUNK_MS / 1000; // 3200 samples = 6400 bytes
const ASR_HOST      = 'asr.cloud.tencent.com';

// ─── 状态 ─────────────────────────────────────────────────────────────────────
let ws              = null;
let audioCtx        = null;
let mediaStream     = null;
let scriptProcessor = null;
let pcmBuffer       = new Int16Array(0);
let sendInterval    = null;
let isRecording     = false;
let segments        = {};
let _wsCloseExpected = false;

// ─── 签名生成（浏览器端 HMAC-SHA1，直连腾讯 ASR，无需代理）─────────────────────
async function buildAsrUrl(cfg) {
  const appid     = document.getElementById('cfg-appid').value.trim();
  const secretId  = document.getElementById('cfg-secretid').value.trim();
  const secretKey = document.getElementById('cfg-secretkey').value.trim();
  if (!appid || !secretId || !secretKey) throw new Error('请先填写 AppID / SecretID / SecretKey');

  const timestamp = Math.floor(Date.now() / 1000);
  const expired   = timestamp + 86400;
  const nonce     = Math.floor(Math.random() * 1000000000);
  const voiceId   = crypto.randomUUID();

  const params = {
    engine_model_type: cfg.engine,
    expired,
    filter_punc:       cfg.punc ? 1 : 0,
    needvad:           cfg.vad  ? 1 : 0,
    nonce,
    secretid:          secretId,
    timestamp,
    voice_format:      1,
    voice_id:          voiceId,
    word_info:         0,
  };

  // 按字典序排序，拼接签名原串（不含协议头）
  const sortedKeys = Object.keys(params).sort();
  const signStr = ASR_HOST + '/asr/v2/' + appid + '?' +
    sortedKeys.map(k => k + '=' + params[k]).join('&');

  log('[签名] 原串: ' + signStr.slice(0, 80) + '…', 'info');

  // HMAC-SHA1 via crypto.subtle
  const enc      = new TextEncoder();
  const keyData  = await crypto.subtle.importKey(
    'raw', enc.encode(secretKey),
    { name: 'HMAC', hash: 'SHA-1' },
    false, ['sign']
  );
  const sigBuf   = await crypto.subtle.sign('HMAC', keyData, enc.encode(signStr));
  const sigB64   = btoa(String.fromCharCode(...new Uint8Array(sigBuf)));
  const signature = encodeURIComponent(sigB64);

  const query = sortedKeys.map(k => k + '=' + encodeURIComponent(params[k])).join('&')
    + '&signature=' + signature;

  return 'wss://' + ASR_HOST + '/asr/v2/' + appid + '?' + query;
}

// ─── 配置持久化 ───────────────────────────────────────────────────────────────
// 默认值常量
const DEFAULTS = {
  appid:     '1410742121',
  secretid:  'AKIDCURHwUzUuSyUxFPM9j6GEzXstjLly0pR',
  secretkey: 'VqzveBWdY7VgjZEuXzHVfgefbNAoOn25',
  sbUrl:     'https://cgtrlucacjrbtazidixn.supabase.co',
  fnUrl:     'https://cgtrlucacjrbtazidixn.supabase.co/functions/v1/query',
  engine:    '16k_zh',
  vad:       true,
  punc:      false,
};

function loadConfig() {
  try {
    const saved = JSON.parse(localStorage.getItem('tencent_asr_cfg') || '{}');
    const c = { ...DEFAULTS, ...saved };  // 默认值兜底，localStorage 优先
    document.getElementById('cfg-appid').value     = c.appid;
    document.getElementById('cfg-secretid').value  = c.secretid;
    document.getElementById('cfg-secretkey').value = c.secretkey;

    document.getElementById('cfg-engine').value    = c.engine;
    document.getElementById('cfg-vad').checked     = c.vad;
    document.getElementById('cfg-punc').checked    = c.punc;
  } catch (e) {}
}

function saveConfig() {
  const c = getConfig();
  localStorage.setItem('tencent_asr_cfg', JSON.stringify(c));
  const ok = document.getElementById('save-ok');
  ok.classList.remove('hidden');
  setTimeout(() => ok.classList.add('hidden'), 2000);
}

function getConfig() {
  return {
    appid:     document.getElementById('cfg-appid').value.trim(),
    secretid:  document.getElementById('cfg-secretid').value.trim(),
    secretkey: document.getElementById('cfg-secretkey').value.trim(),
    engine:    document.getElementById('cfg-engine').value,
    vad:       document.getElementById('cfg-vad').checked,
    punc:      document.getElementById('cfg-punc').checked,
    sbUrl:     DEFAULTS.sbUrl,
    fnUrl:     DEFAULTS.fnUrl,
  };
}

// ─── 日志 ─────────────────────────────────────────────────────────────────────
function log(msg, type = 'info') {
  const box = document.getElementById('log-box');
  const d   = document.createElement('div');
  d.className = `log-line ${type}`;
  const ts  = new Date().toTimeString().slice(0, 8);
  d.textContent = `[${ts}] ${msg}`;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function clearLog() {
  document.getElementById('log-box').innerHTML = '';
}

function copyLog() {
  const box = document.getElementById('log-box');
  const lines = Array.from(box.querySelectorAll('.log-line'))
    .map(el => el.textContent).join('\n');
  if (!lines) return;
  navigator.clipboard.writeText(lines).then(() => {
    log('日志已复制到剪贴板', 'ok');
  });
}

// ─── 状态指示 ─────────────────────────────────────────────────────────────────
function setStatus(text, color) {
  document.getElementById('status-text').textContent = text;
  const dot = document.getElementById('status-dot');
  dot.className = `w-2 h-2 rounded-full ${color}`;
}

// ─── 主开关 ───────────────────────────────────────────────────────────────────
async function toggleRecording() {
  if (isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
}

async function startRecording() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    log('[WARN] 已有活跃连接，忽略重复启动', 'err');
    return;
  }

  _wsCloseExpected = false;
  pcmBuffer = new Int16Array(0);

  // 先请求麦克风权限（避免 WS 连上后等待授权超时）
  log('[MIC] 请求麦克风权限…', 'info');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, sampleRate: SAMPLE_RATE, echoCancellation: true, noiseSuppression: true }
    });
    const track = stream.getAudioTracks()[0];
    log(`[MIC] 权限获取成功 ✓ track="${track?.label}" state=${track?.readyState}`, 'ok');
  } catch (err) {
    log(`[MIC] 麦克风权限获取失败: ${err.message}`, 'err');
    return;
  }

  // 生成签名 URL
  let wsUrl;
  try {
    const cfg = getConfig();
    wsUrl = await buildAsrUrl(cfg);
    log(`[WS] 直连腾讯 ASR… ${wsUrl.slice(0, 80)}…`, 'info');
  } catch (err) {
    log(`[签名] ${err.message}`, 'err');
    stream.getTracks().forEach(t => t.stop());
    return;
  }

  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    log('[WS] 已连接腾讯 ASR，等待握手确认…', 'info');
  };

  // 握手阶段标志
  let handshakeDone = false;

  ws.onmessage = (e) => {
    // 解析消息（腾讯偶尔以 binary 发 JSON）
    const decode = async () => {
      let text;
      if (typeof e.data === 'string') {
        text = e.data;
      } else {
        const buf = e.data instanceof Blob ? await e.data.arrayBuffer() : e.data;
        text = new TextDecoder().decode(buf);
      }
      if (!text.startsWith('{')) return;
      log(`[WS] 收到: ${text.slice(0, 120)}`, 'info');
      try {
        const msg = JSON.parse(text);
        if (!handshakeDone) {
          if (msg.code === 0) {
            handshakeDone = true;
            log('[WS] 握手成功（code=0）✓ 开始推送音频', 'ok');
            setStatus('已连接', 'bg-green-500 animate-pulse_dot');
            startMicPipeline(stream);
          } else {
            log(`[WS] 握手失败 code=${msg.code}: ${msg.message}`, 'err');
            _wsCloseExpected = true;
            stream.getTracks().forEach(t => t.stop());
            ws && ws.close();
          }
          return;
        }
        handleAsrMessage(msg);
      } catch (err) {
        log(`[WS] JSON 解析错误: ${err.message}`, 'err');
      }
    };
    decode();
  };

  ws.onerror = () => log('[WS] WebSocket 连接错误', 'err');

  ws.onclose = (e) => {
    const tag = _wsCloseExpected ? 'info' : (e.code === 1000 ? 'info' : 'err');
    log(`[WS] 连接关闭 code=${e.code} reason="${e.reason}" expected=${_wsCloseExpected}`, tag);
    if (!_wsCloseExpected) finishRecording();
  };
}



function startMicPipeline(stream) {
  isRecording = true;
  updateUI(true);
  mediaStream = stream;

  audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
  log(`[AudioCtx] sampleRate=${audioCtx.sampleRate} state=${audioCtx.state}`, 'info');

  const source = audioCtx.createMediaStreamSource(mediaStream);
  scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);

  let audioFrameCount = 0;
  scriptProcessor.onaudioprocess = (e) => {
    const f32    = e.inputBuffer.getChannelData(0);
    const i16    = float32ToInt16(f32);
    const merged = new Int16Array(pcmBuffer.length + i16.length);
    merged.set(pcmBuffer);
    merged.set(i16, pcmBuffer.length);
    pcmBuffer = merged;
    audioFrameCount++;
    if (audioFrameCount === 1) {
      log(`[AUDIO] 首帧音频采集 f32=${f32.length} bufLen=${pcmBuffer.length}`, 'ok');
    }
  };

  source.connect(scriptProcessor);
  scriptProcessor.connect(audioCtx.destination);
  log('[MIC] 音频管道已启动，开始推送 PCM', 'ok');

  let sendCount = 0;
  sendInterval = setInterval(() => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (pcmBuffer.length >= CHUNK_SAMPLES) {
      const chunk = pcmBuffer.slice(0, CHUNK_SAMPLES);
      pcmBuffer   = pcmBuffer.slice(CHUNK_SAMPLES);
      ws.send(chunk.buffer);
      sendCount++;
      if (sendCount <= 3 || sendCount % 25 === 0) {
        log(`[SEND] 第${sendCount}帧 ${chunk.byteLength}B 已发送 bufRem=${pcmBuffer.length}`, 'info');
      }
    } else {
      // 缓冲不足补静音，维持 1:1 实时率
      ws.send(new Int16Array(CHUNK_SAMPLES).buffer);
    }
  }, PCM_CHUNK_MS);
}

function stopRecording() {
  log('[STOP] 停止录音，发送 end 信号…');

  clearInterval(sendInterval);
  sendInterval = null;

  // 释放音频资源（麦克风关掉，但 WS 保持打开等待 final=1）
  if (mediaStream)     { mediaStream.getTracks().forEach((t) => t.stop()); mediaStream = null; }
  if (scriptProcessor) { scriptProcessor.disconnect(); scriptProcessor = null; }
  if (audioCtx)        { audioCtx.close(); audioCtx = null; }

  // 先更新UI为停止状态
  isRecording = false;
  updateUI(false);
  setStatus('等待结果…', 'bg-yellow-400');

  // 发送剩余缓冲
  if (ws && ws.readyState === WebSocket.OPEN && pcmBuffer.length > 0) {
    log(`[STOP] 发送剩余缓冲 ${pcmBuffer.byteLength} bytes`, 'info');
    ws.send(pcmBuffer.buffer);
    pcmBuffer = new Int16Array(0);
  }

  // 发送结束标记，WS 保持打开等待 final=1 回调
  if (ws && ws.readyState === WebSocket.OPEN) {
    log('[STOP] 发送 {"type":"end"}，等待 final=1…', 'info');
    ws.send(JSON.stringify({ type: 'end' }));
    // 超时保护：5秒内没收到 final=1 就强制关闭
    setTimeout(() => {
      if (ws) {
        log('[STOP] 超时未收到 final=1，强制关闭', 'err');
        _wsCloseExpected = true;
        ws.close(1000, 'timeout');
        ws = null;
        setStatus('未连接', 'bg-muted');
      }
    }, 5000);
  } else {
    log(`[STOP] WS 已非 OPEN，跳过 end 信号`, 'err');
    setStatus('未连接', 'bg-muted');
    ws = null;
  }
}

function finishRecording() {
  isRecording = false;
  updateUI(false);
  setStatus('未连接', 'bg-muted');
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
    _wsCloseExpected = true;
    ws.close(1000, 'session ended');
  }
  ws = null;
  log('[STATE] 录音会话结束，资源已释放', 'info');
}

// ─── ASR 消息处理 ─────────────────────────────────────────────────────────────
function handleAsrMessage(msg) {
  if (msg.code !== 0) {
    log(`ASR 错误 ${msg.code}: ${msg.message}`, 'err');
    return;
  }
  if (msg.final === 1) {
    log('识别完成 ✓ 触发AI查询', 'ok');
    renderTranscript();
    // 关闭 WS
    if (ws) {
      _wsCloseExpected = true;
      ws.close(1000, 'final received');
      ws = null;
    }
    setStatus('未连接', 'bg-muted');
    // 自动触发知识库查询
    const question = document.getElementById('transcript-box').innerText.trim();
    if (question) queryKnowledge(question);
    return;
  }

  const r = msg.result;
  if (!r) return;

  const idx = r.index;
  if (!segments[idx]) segments[idx] = { stable: '', interim: '' };

  if (r.slice_type === 2) {
    // 稳态结果
    segments[idx].stable  = r.voice_text_str;
    segments[idx].interim = '';
    log(`[稳定] #${idx}: ${r.voice_text_str}`, 'ok');
  } else {
    // 中间结果
    segments[idx].interim = r.voice_text_str;
  }

  renderTranscript();
}

function renderTranscript() {
  const box     = document.getElementById('transcript-box');
  box.innerHTML = '';
  const indices = Object.keys(segments).map(Number).sort((a, b) => a - b);

  for (const idx of indices) {
    const seg = segments[idx];
    if (seg.stable) {
      const span = document.createElement('span');
      span.className   = 'segment-stable animate-fade_in';
      span.textContent = seg.stable;
      box.appendChild(span);
    }
    if (seg.interim) {
      const span = document.createElement('span');
      span.className   = 'segment-interim';
      span.textContent = seg.interim;
      box.appendChild(span);
    }
  }

  const text = box.innerText || '';
  document.getElementById('word-count').textContent =
    `${[...text.replace(/\s/g, '')].length} 字`;
}

// ─── 知识库查询 ───────────────────────────────────────────────────────────────
async function queryKnowledge(question) {
  const cfg = getConfig();
  const box     = document.getElementById('answer-box');
  const loading = document.getElementById('answer-loading');

  log('[KB] ── 开始查询 ──', 'info');
  log('[KB] 问题: ' + question, 'info');
  log('[KB] Edge Function URL: ' + cfg.fnUrl, 'info');

  if (!cfg.fnUrl) {
    log('[KB] ❌ 未配置 Edge Function URL，跳过查询', 'err');
    box.textContent = '未配置 Edge Function URL';
    box.className = 'p-4 text-sm text-red-500';
    return;
  }

  box.textContent = '查询中…';
  box.className = 'p-4 text-sm leading-relaxed text-gray-400 italic whitespace-pre-wrap';
  loading.classList.remove('hidden');

  try {
    log('[KB] 发送 fetch 请求…', 'info');
    const res = await fetch(cfg.fnUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    log('[KB] 响应状态: ' + res.status + ' ' + res.statusText, res.ok ? 'info' : 'err');
    const data = await res.json();
    log('[KB] 响应数据: ' + JSON.stringify(data).slice(0, 120), 'info');
    if (data.error) throw new Error(data.error);
    box.textContent = data.answer;
    box.className = 'p-4 text-sm leading-relaxed text-ink whitespace-pre-wrap';
    log('[KB] ✓ 回答完成，引用 ' + data.sources + ' 条知识', 'ok');
  } catch (err) {
    box.textContent = '查询失败: ' + err.message;
    box.className = 'p-4 text-sm text-red-500';
    log('[KB] ❌ 查询失败: ' + err.message, 'err');
  } finally {
    loading.classList.add('hidden');
  }
}

// ─── 工具函数 ─────────────────────────────────────────────────────────────────
function float32ToInt16(f32) {
  const i16 = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) {
    const s = Math.max(-1, Math.min(1, f32[i]));
    i16[i]  = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return i16;
}

function updateUI(recording) {
  document.getElementById('icon-mic').classList.toggle('hidden', recording);
  document.getElementById('icon-stop').classList.toggle('hidden', !recording);
  const btn = document.getElementById('mic-btn');
  btn.classList.toggle('bg-accent',     recording);
  btn.classList.toggle('border-accent', recording);
  btn.classList.toggle('text-paper',    recording);
  const wf = document.getElementById('waveform');
  wf.classList.toggle('hidden', !recording);
  wf.classList.toggle('flex',    recording);
}

function copyTranscript() {
  const text = document.getElementById('transcript-box').innerText;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => log('已复制到剪贴板', 'ok'));
}

function clearTranscript() {
  segments = {};
  document.getElementById('transcript-box').innerHTML = '';
  document.getElementById('word-count').textContent   = '0 字';
}

// ─── 初始化 ───────────────────────────────────────────────────────────────────
loadConfig();
</script>
